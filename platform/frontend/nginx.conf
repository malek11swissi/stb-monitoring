server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'UP';
  }

  # En conteneur, Angular appelle /api sur la même origine. Nginx transmet
  # alors la requête au service .NET sans exposer son nom Docker au navigateur.
  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Les avatars et preuves sont servis par l'API mais affichés dans Angular.
  location /avatars/ {
    proxy_pass http://api:8080/avatars/;
  }

  location /attachments/ {
    proxy_pass http://api:8080/attachments/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
