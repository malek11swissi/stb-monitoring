apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-public-platform }
spec:
  podSelector: { matchExpressions: [{ key: app, operator: In, values: [stb-api, stb-frontend] }] }
  policyTypes: [Ingress]
  ingress: [{ from: [{ namespaceSelector: {} }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-internal-services }
spec:
  podSelector: { matchLabels: { app: stb-ai-service } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: stb-api } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-platform-postgres }
spec:
  podSelector: { matchLabels: { app: stb-postgres } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { app: stb-api } } }], ports: [{ port: 5432 }] }]
