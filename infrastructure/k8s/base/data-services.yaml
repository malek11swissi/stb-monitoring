apiVersion: apps/v1
kind: StatefulSet
metadata: { name: stb-postgres }
spec:
  serviceName: stb-postgres
  replicas: 1
  selector: { matchLabels: { app: stb-postgres } }
  template:
    metadata: { labels: { app: stb-postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ name: postgres, containerPort: 5432 }]
          envFrom: [{ secretRef: { name: stb-database-env } }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 750m, memory: 1Gi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: stb-postgres }
spec: { selector: { app: stb-postgres }, ports: [{ name: postgres, port: 5432 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: rne-mongodb }
spec:
  serviceName: rne-mongodb
  replicas: 1
  selector: { matchLabels: { app: rne-mongodb } }
  template:
    metadata: { labels: { app: rne-mongodb, stb.io/type: simulator-database } }
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0
          ports: [{ name: mongo, containerPort: 27017 }]
          envFrom: [{ secretRef: { name: rne-database-env } }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 750m, memory: 1Gi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 3Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: rne-mongodb }
spec: { selector: { app: rne-mongodb }, ports: [{ name: mongo, port: 27017 }] }
---
