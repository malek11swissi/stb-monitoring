apiVersion: apps/v1
kind: Deployment
metadata: { name: core-banking-simulator }
spec:
  replicas: 1
  selector: { matchLabels: { app: core-banking-simulator } }
  template:
    metadata: { labels: { app: core-banking-simulator, stb.io/type: simulator } }
    spec:
      containers:
        - name: simulator
          image: registry.local/stb-monitoring/core-banking-simulator:latest
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: ConnectionStrings__Oracle, valueFrom: { secretKeyRef: { name: stb-secrets, key: oracle-connection } } }
            - { name: Lab__AdminKey, valueFrom: { secretKeyRef: { name: stb-secrets, key: lab-key } } }
          readinessProbe: { httpGet: { path: /api/lab/scenario, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/lab/scenario, port: http }, initialDelaySeconds: 45, periodSeconds: 20 }
          resources: { requests: { cpu: 75m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: core-banking-simulator }
spec: { selector: { app: core-banking-simulator }, ports: [{ name: http, port: 8080, targetPort: http }] }
---
