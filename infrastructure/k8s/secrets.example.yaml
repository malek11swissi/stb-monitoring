# Copier ce fichier hors Git, remplacer toutes les valeurs puis l'appliquer dans
# chaque namespace. Ne jamais committer le fichier réel.
apiVersion: v1
kind: Secret
metadata: { name: stb-secrets }
type: Opaque
stringData:
  postgres-connection: Host=stb-postgres;Port=5432;Database=CHANGE_ME;Username=CHANGE_ME;Password=CHANGE_ME
  jwt-key: CHANGE_ME_MINIMUM_32_RANDOM_CHARACTERS
  smtp-username: CHANGE_ME_GMAIL_ADDRESS
  smtp-sender: CHANGE_ME_GMAIL_ADDRESS
  smtp-password: CHANGE_ME_GMAIL_APP_PASSWORD
  lab-key: CHANGE_ME_RANDOM_LAB_KEY
  oracle-connection: User Id=CHANGE_ME;Password=CHANGE_ME;Data Source=core-oracle:1521/FREEPDB1
  mongo-connection: mongodb://CHANGE_ME:CHANGE_ME@rne-mongodb:27017/?authSource=admin
  mysql-connection: Server=sms-mysql;Port=3306;Database=CHANGE_ME;User ID=CHANGE_ME;Password=CHANGE_ME
  sqlserver-connection: Server=hr-sqlserver,1433;Database=CHANGE_ME;User Id=sa;Password=CHANGE_ME;TrustServerCertificate=True
---
apiVersion: v1
kind: Secret
metadata: { name: stb-database-env }
type: Opaque
stringData: { POSTGRES_DB: CHANGE_ME, POSTGRES_USER: CHANGE_ME, POSTGRES_PASSWORD: CHANGE_ME }
---
apiVersion: v1
kind: Secret
metadata: { name: rne-database-env }
type: Opaque
stringData: { MONGO_INITDB_ROOT_USERNAME: CHANGE_ME, MONGO_INITDB_ROOT_PASSWORD: CHANGE_ME }
---
apiVersion: v1
kind: Secret
metadata: { name: sms-database-env }
type: Opaque
stringData: { MYSQL_DATABASE: CHANGE_ME, MYSQL_USER: CHANGE_ME, MYSQL_PASSWORD: CHANGE_ME, MYSQL_ROOT_PASSWORD: CHANGE_ME }
---
apiVersion: v1
kind: Secret
metadata: { name: hr-database-env }
type: Opaque
stringData: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: CHANGE_ME }
---
apiVersion: v1
kind: Secret
metadata: { name: core-database-env }
type: Opaque
stringData: { ORACLE_PASSWORD: CHANGE_ME, APP_USER: CHANGE_ME, APP_USER_PASSWORD: CHANGE_ME }
